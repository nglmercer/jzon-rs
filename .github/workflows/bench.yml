name: Benchmarks
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [native, compat]
        default: native
      features:
        type: string
        default: 'simd,simd-intrinsics,zmij-float-ser,float_roundtrip'
permissions:
  contents: read
jobs:
  measure:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Record invocation and run fresh estimates
        shell: bash
        env:
          MODE: ${{ inputs.mode }}
          FEATURES: ${{ inputs.features }}
          CRITERION_HOME: benchmark-invocation
        run: |
          mkdir -p out
          rustc -Vv > out/compiler.txt
          cargo metadata --format-version 1 > out/dependencies.json
          git rev-parse HEAD > out/commit.txt
          git diff --binary > out/worktree.patch
          cp Cargo.lock out/Cargo.lock
          python3 - <<'PY'
          import hashlib,json,os,pathlib,platform,subprocess
          datasets={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in pathlib.Path('crates/jzon/data').glob('*.json')}
          metadata=dict(commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),os=platform.platform(),cpu=platform.processor(),mode=os.environ['MODE'],features=os.environ['FEATURES'],rustflags=os.environ.get('RUSTFLAGS',''),allocator='system default',datasets=datasets,sample_settings='Criterion CLI defaults; individual native groups specify overrides')
          pathlib.Path('out/metadata.json').write_text(json.dumps(metadata,indent=2))
          PY
          set -o pipefail
          if [ "$MODE" = compat ]; then
            cargo bench -p jzon-rs-compat --bench bench_compat -- --sample-size 30 --warm-up-time 1 --measurement-time 3 2>&1 | tee out/run.log
          else
            cargo bench -p jzon-rs --bench bench_cmp --features "$FEATURES" 2>&1 | tee out/run.log
          fi
          python3 tools/benchmark-report.py benchmark-invocation --metadata out/metadata.json --output out/current-results.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: measurements-${{ matrix.os }}-${{ inputs.mode }}
          path: |
            out
            benchmark-invocation
