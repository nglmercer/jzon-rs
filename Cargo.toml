[workspace]
members = [
    "crates/jzon",
    "crates/jzon_derive",
    "crates/jzon_serde",
    "crates/jzon_compat",
]
exclude = ["vendor/serde_json"]
resolver = "2"

[workspace.package]
version = "0.4.0"
edition = "2021"
authors = ["Rajaniraiyn <rajaniraiyn@gmail.com>"]
license = "MIT"
repository = "https://github.com/nglmercer/jzon-rs"
homepage = "https://github.com/nglmercer/jzon-rs"
keywords = ["json", "serialization", "zero-copy", "simd", "serde"]
categories = ["encoding", "parsing"]
rust-version = "1.71"

[patch.crates-io]
serde_json = { path = "vendor/serde_json" }
