[package]
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Strict serde_json compatibility facade with single-invocation upstream delegation"
name = "jzon-rs-compat"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
std = ["serde_json/std"]
alloc = ["serde_json/alloc"]
arbitrary_precision = ["serde_json/arbitrary_precision"]
preserve_order = ["serde_json/preserve_order"]
raw_value = ["serde_json/raw_value"]
float_roundtrip = ["serde_json/float_roundtrip"]
unbounded_depth = ["serde_json/unbounded_depth"]
# Accepted legacy flags. This strict facade always delegates; these flags do
# not enable native acceleration. Use jzon-rs-serde for native engine options.
simd = []
simd-intrinsics = ["simd"]
zmij-float-ser = []
fast-float = []
unstable = []
stats = []

[dependencies]
serde_json = { version = "=1.0.151", default-features = false }

[dev-dependencies]
criterion = "0.5"
serde = { version = "1", features = ["derive"] }

[[bench]]
name = "bench_compat"
harness = false
