[package]
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Serde-compatible JSON engine backed by jzon's SIMD scanner"
name = "jzon-rs-serde"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default    = ["std"]
std = ["jzon/std"]
alloc = ["jzon/alloc"]
simd       = ["jzon/simd"]
simd-intrinsics = ["jzon/simd-intrinsics"]
zmij-float-ser = ["jzon/zmij-float-ser"]
fast-float = ["jzon/fast-float"]
unstable   = ["jzon/unstable"]
stats      = ["jzon/stats"]
# Engine-affecting serde_json mirrors. Enable `arbitrary_precision` here when
# the serde_json you deserialize into has its own `arbitrary_precision` on,
# so out-of-range numbers visit as exact digit strings instead of f64.
arbitrary_precision = ["jzon/arbitrary_precision"]
float_roundtrip = ["jzon/float_roundtrip"]
raw_value = ["jzon/raw_value"]
unbounded_depth     = ["jzon/unbounded_depth"]

[dependencies]
jzon  = { package = "jzon-rs", path = "../jzon", version = "0.4", default-features = false, features = ["serde"] }

[dev-dependencies]
serde      = { version = "1", features = ["derive"] }
serde_json = { version = "=1.0.151", path = "../../vendor/serde_json" }

[lib]
name = "jzon_serde"
